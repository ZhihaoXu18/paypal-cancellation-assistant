<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>付款授权审核助手</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">商家审核工作台 · 开发预览</p>
        <h1>付款授权审核助手</h1>
        <p>发现订单取消后仍保留的 PayPal 付款授权，供商家核实。</p>
        <p id="health" role="status">正在检查应用状态…</p>
      </header>
      <article aria-labelledby="order-title">
        <span class="badge">模拟数据</span>
        <h2 id="order-title">订单 DEMO-1001</h2>
        <dl>
          <div><dt>订单金额</dt><dd>CAD 100</dd></div>
          <div><dt>订单状态</dt><dd>已取消</dd></div>
          <div><dt>发货状态</dt><dd>未发货</dd></div>
          <div><dt>付款状态</dt><dd>已授权但未收款</dd></div>
          <div><dt>付款授权</dt><dd>尚未取消（模拟）</dd></div>
        </dl>
        <aside>
          <h3>审核建议</h3>
          <p>需要核实并取消付款授权</p>
          <p class="note">请商家核实订单与付款状态。本页面仅展示模拟案件，未连接 PayPal，不执行取消授权或其他支付操作。</p>
        </aside>
      </article>
    </main>
  </body>
</html>
